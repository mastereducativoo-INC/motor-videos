<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>16 · Garantía de 7 días</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(900px 700px at 28% 50%,#16314a 0%,transparent 64%),var(--deep)}
svg{position:absolute;left:150px;top:190px;width:700px;height:700px}
.seg{fill:none;stroke:rgba(255,255,255,.09);stroke-width:46}
.on{fill:none;stroke:var(--cyan);stroke-width:46;opacity:0;animation:on .5s var(--out) both;animation-delay:var(--d)}
@keyframes on{from{opacity:0}to{opacity:1}}
.num{position:absolute;left:150px;top:190px;width:700px;height:700px;display:grid;place-items:center;text-align:center}
.num b{font-size:300px;font-weight:800;letter-spacing:-.06em;line-height:.9;display:block}
.num span{font-family:Nunito;font-weight:800;font-size:34px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.tx{position:absolute;left:990px;top:250px;width:800px}
.tx h1{font-size:88px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin-top:18px}
.tx p{font-size:42px;line-height:1.35;color:var(--muted);margin-top:34px;font-weight:400}
.tx .h{margin-top:50px;display:inline-block;padding:18px 36px;border:2px solid var(--line);border-radius:999px;font-size:32px;font-weight:600}
</style></head>
<body>
<svg viewBox="-350 -350 700 700" id="s"></svg>
<div class="num"><div><b id="n">0</b><span>días</span></div></div>
<div class="tx"><div class="lbl fade" style="--d:.4s">Garantía</div>
  <h1 class="t" style="--d:.7s">Pruébalo durante<br><i class="k">7 días.</i></h1>
  <p class="fade" style="--d:8.6s">Revisa todo el pack con calma. Si no te gusta, te devolvemos tu dinero.</p>
  <div class="h fade" style="--d:11s">Reembolso por Hotmart</div></div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 15; window.MUSICA = 'suave'; const T0 = 1.8, P = .85; window.SFX = [...Array(7)].map((_, i) => [T0 + i * P, 'click']).concat([[T0 + 7 * P, 'ding']]);
const s = document.getElementById('s'), R = 290, gap = 5;
for (let i = 0; i < 7; i++) { const a0 = (-90 + i * 360 / 7 + gap / 2) * Math.PI / 180, a1 = (-90 + (i + 1) * 360 / 7 - gap / 2) * Math.PI / 180;
  const d = `M${R * Math.cos(a0)} ${R * Math.sin(a0)} A${R} ${R} 0 0 1 ${R * Math.cos(a1)} ${R * Math.sin(a1)}`;
  s.insertAdjacentHTML('beforeend', `<path class="seg" d="${d}"/><path class="on" style="--d:${T0 + i * P}s" d="${d}"/>`); }
M.split('.t');
window.onFrame = (t) => { document.getElementById('n').textContent = Math.max(0, Math.min(7, Math.floor((t - T0) / P) + 1)); };
</script>
</body></html>
