<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>02 · Product film: las 7 herramientas</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(1100px 760px at 8% 0%,#22d3ee 0%,#0e6f86 28%,transparent 62%),radial-gradient(900px 700px at 100% 100%,#7a2a78 0%,transparent 60%),#04040e}
.stage{position:absolute;left:192px;top:150px;width:1536px;height:810px;border-radius:44px;background:#07070f;box-shadow:0 60px 120px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;animation:st 1.2s var(--out) both}
@keyframes st{from{transform:scale(.9) translateY(60px);opacity:0}to{transform:none;opacity:1}}
.cab{position:absolute;left:70px;top:54px;right:70px;display:flex;justify-content:space-between;align-items:baseline}
.cab b{font-size:34px;font-weight:700;letter-spacing:-.02em}
.cover{position:absolute;left:70px;top:150px;width:520px;height:520px;border-radius:28px;background:radial-gradient(circle at 30% 20%,#23245c,#0d0d22);overflow:hidden}
.cover img{position:absolute;inset:34px;width:452px;height:452px;object-fit:contain;opacity:0;transform:scale(.9);transition:none;filter:drop-shadow(0 26px 30px rgba(0,0,0,.55))}
.lista{position:absolute;left:660px;top:150px;right:70px}
.fila{display:grid;grid-template-columns:54px 1fr auto;align-items:center;height:72px;padding:0 24px;border-radius:16px;font-size:28px;white-space:nowrap;font-weight:600;color:var(--muted);letter-spacing:-.01em;opacity:0;animation:fade .6s var(--out) both;animation-delay:calc(1.1s + var(--n)*.09s)}
.fila span{font-family:Nunito;font-weight:800;font-size:22px}
.fila small{font-family:Nunito;font-weight:700;font-size:22px}
.fila.on{background:rgba(34,211,238,.12);color:var(--ink)}
.fila.on span,.fila.on small{color:var(--cyan)}
.fila.hecho{color:#d9d6ee}
.barra{position:absolute;left:70px;right:70px;bottom:50px;height:76px;border-radius:38px;background:#12122a;display:flex;align-items:center;gap:24px;padding:0 30px}
.play{width:44px;height:44px;border-radius:50%;background:var(--ink);position:relative;flex:none}
.play::after{content:'';position:absolute;left:17px;top:12px;border-left:15px solid #07070f;border-top:10px solid transparent;border-bottom:10px solid transparent}
.barra b{font-size:24px;font-weight:600;min-width:420px}
.prog{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--cyan)}
.eq{display:flex;gap:5px;align-items:flex-end;height:36px}
.eq i{width:6px;background:var(--pink);border-radius:3px;height:8px}
#fin{background:#07070f;display:grid;grid-template-columns:1fr 1fr;align-items:center}
#fin img{height:660px;justify-self:center;filter:drop-shadow(0 40px 50px rgba(0,0,0,.6));animation:pop 1.1s var(--out) both;animation-delay:14.3s}
#fin h1{font-size:84px;font-weight:800;letter-spacing:-.04em;line-height:1.02}
#fin p{font-size:44px;margin-top:24px;color:var(--muted);font-weight:400}
</style></head>
<body>
<div class="stage">
  <div class="cab"><b>Súper Pack DJ</b><span class="lbl">7 herramientas para tu próximo evento</span></div>
  <div class="cover" id="cover"></div>
  <div class="lista" id="lista"></div>
  <div class="barra"><i class="play"></i><b id="ahora">—</b><div class="prog"><i id="pr"></i></div><div class="eq" id="eq"></div></div>
  <section class="sc" id="fin" style="--in:14.1s;--to:99s"><img src="assets/dj/pack_5.png" alt="">
    <div><div class="lbl fade" style="--d:14.5s">Todo junto</div><h1 class="t" style="--d:14.8s">7 herramientas.<br><i class="k">Un solo pack.</i></h1><p class="fade" style="--d:15.9s">Listo para cualquier evento.</p></div></section>
</div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 19; window.MUSICA = 'dj'; window.SFX = [[0.1, 'whoosh'], [14.0, 'whoosh']];
const C = [['Guiones completos de evento', 'De inicio a cierre'], ['Kit de emergencia en vivo', 'Pista muerta o fallas'], ['Checklist profesional', 'Antes de tocar'], ['Intros, cortes y transiciones', 'Recursos listos'],
  ['Sistema para leer la pista', 'Decisiones en tiempo real'], ['Plan de preparación en 7 días', 'Ruta antes del evento'], ['Mensajes para cerrar eventos', 'Vende tus servicios']];
const L = document.getElementById('lista'), CV = document.getElementById('cover'), EQ = document.getElementById('eq');
C.forEach(([a, b], i) => { L.insertAdjacentHTML('beforeend', `<div class="fila" style="--n:${i}"><span>${String(i + 1).padStart(2, '0')}</span><div>${a}</div><small>${b}</small></div>`); CV.insertAdjacentHTML('beforeend', `<img src="assets/dj/c${i}_5.png" alt="">`); });
for (let i = 0; i < 14; i++) EQ.insertAdjacentHTML('beforeend', '<i></i>');
M.split('.t');
const T0 = 2.2, PASO = 1.65, filas = [...L.children], imgs = [...CV.children], barras = [...EQ.children];
window.onFrame = (t) => {
  const u = (t - T0) / PASO, k = Math.max(-1, Math.min(6, Math.floor(u))), f = u - Math.floor(u);
  filas.forEach((el, i) => { el.classList.toggle('on', i === k && t >= T0); el.classList.toggle('hecho', i < k); });
  imgs.forEach((im, i) => { let a = 0, s = .9; if (i === k) { a = M.out(f / .25) * (1 - M.cl((f - .9) / .1)); s = .9 + .1 * M.out(f / .5) + f * .03; } im.style.opacity = a; im.style.transform = `scale(${s}) rotate(${(1 - M.out(f / .6)) * -4}deg)`; });
  document.getElementById('ahora').textContent = k >= 0 ? C[k][0] : 'Súper Pack DJ';
  document.getElementById('pr').style.width = (M.cl((t - T0) / (PASO * 7)) * 100) + '%';
  barras.forEach((b, i) => { b.style.height = (8 + Math.abs(Math.sin(t * (5 + i % 4) + i * 1.3)) * 28) + 'px'; });
};
</script>
</body></html>
