<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>19 · Cargando tu pack</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(1100px 700px at 50% 40%,#12143a 0%,transparent 66%),#03030a}
.win{position:absolute;left:190px;top:110px;width:1540px;height:860px;border-radius:26px;background:#0a0b1c;border:1px solid var(--line);box-shadow:0 60px 120px rgba(0,0,0,.6);overflow:hidden}
.top{height:74px;background:#11132b;display:flex;align-items:center;gap:14px;padding:0 30px;font-family:Nunito;font-weight:700;font-size:24px;color:var(--muted)}
.top i{width:18px;height:18px;border-radius:50%;background:#2a2c52}
.top span{margin-left:20px}
.cu{padding:44px 60px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:34px;line-height:1}
.ln{display:flex;align-items:center;gap:26px;height:74px;opacity:0}
.ln .n{flex:none;width:800px;white-space:nowrap;color:var(--ink);font-family:Sora;font-weight:600;font-size:32px;letter-spacing:-.01em}
.ln .b{flex:1;height:14px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.ln .b u{display:block;height:100%;width:0;background:var(--cyan);border-radius:7px}
.ln .ok{flex:none;width:120px;text-align:right;color:var(--gold);font-weight:700;font-size:28px;opacity:0}
.cmd{color:var(--cyan);height:70px;display:flex;align-items:center}
.cmd b{display:inline-block;width:18px;height:38px;background:var(--cyan);margin-left:6px}
.fin{height:90px;display:flex;align-items:center;font-family:Sora;font-size:44px;font-weight:800;letter-spacing:-.03em;opacity:0}
</style></head>
<body>
<div class="win"><div class="top"><i></i><i></i><i></i><span>Súper Pack DJ — preparando tu acceso (ejemplo)</span></div>
<div class="cu"><div class="cmd"><span id="cm"></span><b id="cur"></b></div><div id="l"></div><div class="fin" id="fin">Listo para cualquier evento.&nbsp;<i class="k" style="font-weight:500">$12 USD</i></div></div></div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 16; window.MUSICA = 'energia';
const C = ['Guiones completos de evento', 'Kit de emergencia en vivo', 'Checklist profesional antes de tocar', 'Pack de intros, cortes y transiciones', 'Sistema para leer la pista', 'Plan de preparación en 7 días', 'Mensajes para conseguir y cerrar eventos'];
const l = document.getElementById('l'), CMD = '> abrir super-pack-dj', T0 = 2.2, P = 1.25;
C.forEach((n) => l.insertAdjacentHTML('beforeend', `<div class="ln"><span class="n">${n}</span><span class="b"><u></u></span><span class="ok">listo</span></div>`));
window.SFX = C.map((_, i) => [T0 + i * P + .9, 'click']).concat([[T0 + 7 * P + .2, 'ding']]);
const ls = [...l.children];
window.onFrame = (t) => {
  document.getElementById('cm').textContent = CMD.slice(0, Math.floor(M.cl((t - .5) / 1.3) * CMD.length));
  document.getElementById('cur').style.opacity = Math.floor(t * 2.5) % 2 ? 0 : 1;
  ls.forEach((e, i) => { const u = (t - T0 - i * P); e.style.opacity = M.cl(u / .2); e.children[1].firstChild.style.width = (M.io(M.cl(u / .9)) * 100) + '%'; e.children[2].style.opacity = u > .9 ? 1 : 0; });
  document.getElementById('fin').style.opacity = M.cl((t - T0 - 7 * P - .2) / .5);
};
</script>
</body></html>
