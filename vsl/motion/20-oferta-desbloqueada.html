<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>20 · Compra confirmada → oferta desbloqueada</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(900px 700px at 50% 45%,#22245a 0%,transparent 66%),var(--deep)}
.esc{position:absolute;inset:0;display:grid;place-items:center;perspective:2200px}
.car{position:relative;width:1180px;height:700px;transform-style:preserve-3d}
.lado{position:absolute;inset:0;border-radius:44px;backface-visibility:hidden;border:1px solid var(--line);box-shadow:0 60px 120px rgba(0,0,0,.55);overflow:hidden}
.fr{background:#0d0e24;display:grid;place-items:center;text-align:center}
.fr svg{width:230px;height:230px;display:block;margin:0 auto 34px}
.fr circle{fill:none;stroke:var(--cyan);stroke-width:12;stroke-dasharray:630;stroke-dashoffset:630;animation:tr 1.1s var(--out) forwards;animation-delay:.5s;transform:rotate(-90deg);transform-origin:50% 50%}
.fr path{fill:none;stroke:var(--cyan);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:160;stroke-dashoffset:160;animation:tr .5s var(--out) forwards;animation-delay:1.5s}
@keyframes tr{to{stroke-dashoffset:0}}
.fr h1{font-size:84px;font-weight:800;letter-spacing:-.04em}
.fr p{font-size:38px;color:var(--muted);margin-top:16px}
.bk{background:linear-gradient(150deg,#1b1d52,#0a0a1e 70%);transform:rotateY(180deg);padding:70px 80px}
.bk img{position:absolute;right:36px;top:150px;height:430px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6))}
.bk small{font-family:Nunito;font-weight:800;font-size:26px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.bk h2{font-size:80px;font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:22px}
.bk h3{font-family:Fraunces;font-style:italic;font-weight:500;font-size:46px;color:var(--cyan);margin-top:14px}
.bk .pr{margin-top:70px;font-size:130px;font-weight:800;letter-spacing:-.05em;line-height:1}
.bk .pr s{font-size:54px;color:var(--muted);font-weight:500;margin-right:26px;letter-spacing:-.02em}
.bk p{font-size:32px;color:var(--muted);margin-top:14px}
.pie{position:absolute;left:0;right:0;bottom:70px;text-align:center;font-size:36px;color:var(--muted);opacity:0;animation:fade .8s var(--out) both;animation-delay:10.5s}
</style></head>
<body>
<div class="esc"><div class="car" id="c">
  <div class="lado fr"><div><svg viewBox="0 0 230 230"><circle cx="115" cy="115" r="100"/><path d="M70 118 l32 32 l60 -66"/></svg><h1 class="t" style="--d:1.9s">Compra confirmada</h1><p class="fade" style="--d:2.8s">Tu curso Dj Profesional ya es tuyo.</p></div></div>
  <div class="lado bk"><img src="assets/dj/pack_5.png" alt=""><small>Oferta desbloqueada</small><h2>Súper Pack DJ</h2><h3>Listo para cualquier evento</h3><div class="pr"><s>$120</s>$12</div><p>USD · solo en esta página</p></div>
</div></div>
<div class="pie">7 días de garantía · Acceso inmediato y de por vida</div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 15; window.MUSICA = 'suave'; window.SFX = [[1.5, 'ding'], [5.2, 'whoosh']];
M.split('.t');
window.onFrame = (t) => { const k = M.io(M.cl((t - 5.2) / 1.3)), f = Math.sin(t * .8) * 3 * (t > 6.5 ? 1 : 0); document.getElementById('c').style.transform = `rotateY(${k * 180 + f}deg) scale(${1 - Math.sin(k * Math.PI) * .12})`; };
</script>
</body></html>
