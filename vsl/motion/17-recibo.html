<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>17 · El recibo</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:radial-gradient(1000px 700px at 30% 40%,#22245a 0%,transparent 64%),var(--deep)}
.ran{position:absolute;left:230px;top:92px;width:700px;height:22px;border-radius:11px;background:#02020a;box-shadow:inset 0 3px 8px #000}
.clip{position:absolute;left:250px;top:103px;width:660px;height:980px;overflow:hidden}
.pap{background:#f4f1e6;color:#15151f;padding:44px 46px 60px;font-family:Nunito;will-change:transform}
.pap h3{font-family:Sora;font-size:34px;font-weight:800;letter-spacing:-.02em}
.pap small{display:block;font-size:20px;font-weight:700;letter-spacing:.14em;color:#77758a;margin:6px 0 22px;text-transform:uppercase}
.ln{display:flex;justify-content:space-between;gap:20px;font-size:25px;font-weight:700;height:62px;align-items:center;border-top:2px dashed #cfcab8}
.ln b{font-family:Sora;font-weight:700}
.ln.t{border-top:3px solid #15151f;font-size:30px;height:78px}.ln.t b{font-size:38px}
.ln.d b{color:#c2255c}
.ln.h{background:#15151f;color:#f4f1e6;margin:10px -46px 0;padding:0 46px;height:110px;font-size:34px;border:0}.ln.h b{font-size:66px;color:#f5c84a;font-weight:800}
.tx{position:absolute;left:1040px;top:300px;width:760px}
.tx h1{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin-top:18px}
.tx p{font-size:40px;color:var(--muted);margin-top:30px;line-height:1.35}
</style></head>
<body>
<div class="ran"></div><div class="clip"><div class="pap" id="p"><h3>Súper Pack DJ</h3><small>Valor de referencia</small><div id="l"></div></div></div>
<div class="tx"><div class="lbl fade" style="--d:.4s">Haz la cuenta</div>
  <h1 class="t" style="--d:.7s">7 herramientas. <i class="k">Un solo precio.</i></h1>
  <p class="fade" style="--d:12.2s">$12 USD, solo en esta página.</p></div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 17; window.MUSICA = 'energia';
const C = [['Guiones completos de evento', 25], ['Kit de emergencia en vivo', 15], ['Checklist profesional antes de tocar', 10], ['Pack de intros, cortes y transiciones', 20], ['Sistema para leer la pista', 15], ['Plan de preparación en 7 días', 15], ['Mensajes para conseguir y cerrar eventos', 20]];
const l = document.getElementById('l'); C.forEach(([n, v]) => l.insertAdjacentHTML('beforeend', `<div class="ln"><span>${n}</span><b>$${v}</b></div>`));
l.insertAdjacentHTML('beforeend', '<div class="ln t"><span>Valor total</span><b>$120</b></div><div class="ln d"><span>Descuento 90%</span><b>− $108</b></div><div class="ln h"><span>Hoy pagas</span><b>$12</b></div>');
M.split('.t');
const p = document.getElementById('p'), H = p.offsetHeight, T0 = 1.4, PASOS = [150, 212, 274, 336, 398, 460, 522, 584, 662, 724, H], DT = .95;
window.SFX = PASOS.map((_, i) => [T0 + i * DT, i === PASOS.length - 1 ? 'ding' : 'click']);
window.onFrame = (t) => { const u = (t - T0) / DT, k = Math.floor(u); let v = 0;
  if (u >= 0) { const a = k > 0 ? PASOS[Math.min(k - 1, PASOS.length - 1)] : 0, b = PASOS[Math.min(k, PASOS.length - 1)]; v = a + (b - a) * M.out(M.cl((u - k) / .35)); }
  p.style.clipPath = `inset(0 0 ${Math.max(0, H - v)}px 0)`; };
</script>
</body></html>
