<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>04 · La historia de Julián en viñetas</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--deep)}
.vin{position:absolute;top:120px;height:840px;border-radius:26px;overflow:hidden;background:#0d0d22 center/cover;box-shadow:0 40px 80px rgba(0,0,0,.55);opacity:0;animation:entra 1.1s var(--out) both;animation-delay:var(--d)}
@keyframes entra{from{opacity:0;transform:translateY(120px) rotate(var(--r,2deg))}to{opacity:1;transform:none}}
.vin::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(6,6,21,.92) 100%)}
.vin img{position:absolute;bottom:0;left:50%;height:92%;transform:translateX(-50%);animation:acerca 6s linear both;animation-delay:var(--d)}
@keyframes acerca{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.07)}}
.vin p{position:absolute;left:36px;right:36px;bottom:40px;z-index:2;font-size:44px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.vin em{position:absolute;left:36px;top:32px;z-index:2;font-style:normal;font-family:Nunito;font-weight:800;font-size:22px;letter-spacing:.16em;color:var(--gold)}
#v1{left:90px;width:560px;background-image:url(assets/dj/f_cuarto.jpg)}
#v2{left:680px;width:560px;background-image:url(assets/dj/f_evento.jpg)}
#v3{left:1270px;width:560px;background:radial-gradient(circle at 50% 30%,#3a1d54,#0d0d22)}
.tit{position:absolute;left:90px;top:44px;font-family:Nunito;font-weight:800;font-size:24px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
#b{background:radial-gradient(900px 640px at 20% 70%,rgba(244,114,208,.28) 0%,transparent 62%),var(--deep);display:grid;place-items:center;text-align:center}
#b h2{font-size:84px;font-weight:300;color:var(--muted);letter-spacing:-.02em}
#b h1{font-size:150px;font-weight:800;letter-spacing:-.045em;margin-top:18px}
#c{background:radial-gradient(1000px 700px at 72% 46%,#22245a 0%,transparent 64%),var(--bg)}
#c img{position:absolute;right:190px;top:160px;height:760px;filter:drop-shadow(0 50px 60px rgba(0,0,0,.6));animation:sube2 1.2s var(--out) both;animation-delay:15.3s}
@keyframes sube2{from{transform:translateY(140px);opacity:0}to{transform:none;opacity:1}}
#c .tx{position:absolute;left:150px;top:340px;width:860px}
#c h1{font-size:128px;font-weight:800;letter-spacing:-.04em;line-height:1}
#c h2{font-size:58px;font-weight:400;margin-top:24px}
</style></head>
<body>
<section class="sc" id="a" style="--in:0s;--to:10.6s">
  <div class="tit fade" style="--d:.2s">Una historia de ejemplo · Julián</div>
  <div class="vin" id="v1" style="--d:.5s;--r:-2deg"><em>01</em><img src="assets/dj/j_practica.png" alt=""><p class="t" style="--d:1.2s">Aprendió a mezclar. <i class="k">Y lo hacía bien.</i></p></div>
  <div class="vin" id="v2" style="--d:3.6s;--r:2deg"><em>02</em><img src="assets/dj/j_nervioso.png" alt=""><p class="t" style="--d:4.3s">Llegó su primer evento.</p></div>
  <div class="vin" id="v3" style="--d:6.8s;--r:-1.5deg"><em>03</em><img src="assets/dj/j_frustrado.png" alt="" style="height:78%"><p class="t" style="--d:7.5s">Y la pista <i class="k">se quedó vacía.</i></p></div>
</section>
<section class="sc" id="b" style="--in:10.8s;--to:14.9s"><div><h2 class="t" style="--d:11.1s">No le faltaba talento.</h2><h1 class="t" style="--d:12.4s">Le faltaba <i class="k">preparación.</i></h1></div></section>
<section class="sc" id="c" style="--in:15.1s;--to:99s"><img src="assets/dj/pack_5.png" alt="">
  <div class="tx"><div class="lbl fade" style="--d:15.4s">Para que a ti no te pase</div><h1 class="t" style="--d:15.7s">Súper Pack DJ</h1><h2 class="t" style="--d:16.5s"><i class="k">Listo para cualquier evento.</i></h2></div></section>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 20; window.MUSICA = 'suave'; window.SFX = [[0.5, 'whoosh'], [3.6, 'whoosh'], [6.8, 'whoosh'], [10.7, 'whoosh'], [15.0, 'whoosh']];
M.split('.t');
</script>
</body></html>
