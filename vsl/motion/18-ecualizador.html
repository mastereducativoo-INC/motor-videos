<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>18 · Ecualizador de valor</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:#05050f}
h1{position:absolute;left:130px;top:80px;font-size:72px;font-weight:800;letter-spacing:-.04em}
.tot{position:absolute;right:130px;top:70px;text-align:right}
.tot small{font-family:Nunito;font-weight:800;font-size:22px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;display:block}
.tot b{font-size:96px;font-weight:800;letter-spacing:-.04em;line-height:1}
.eq{position:absolute;left:130px;right:130px;top:250px;height:560px;display:flex;gap:34px;align-items:flex-end;border-bottom:2px solid var(--line)}
.col{flex:1;position:relative;height:100%}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse;gap:6px}
.bar i{height:14px;border-radius:3px;background:var(--cyan)}
.bar i.a{background:var(--gold)}.bar i.r{background:var(--pink)}
.v{position:absolute;left:0;right:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:-.03em}
.nm{position:absolute;left:130px;right:130px;top:830px;display:flex;gap:34px}
.nm span{flex:1;text-align:center;font-size:25px;font-weight:600;line-height:1.2;color:var(--muted)}
.fin{position:absolute;left:0;right:0;bottom:50px;text-align:center;font-size:46px;font-weight:700;letter-spacing:-.02em;opacity:0;animation:fade .8s var(--out) both;animation-delay:12.4s}
</style></head>
<body>
<h1 class="t" style="--d:.3s">Cada herramienta <i class="k">suma.</i></h1>
<div class="tot"><small>Valor de referencia</small><b id="tt">$0</b></div>
<div class="eq" id="eq"></div><div class="nm" id="nm"></div>
<div class="fin">Hoy, todo el pack por <i class="k">$12 USD</i></div>
<div class="grain"></div>
<script src="motion.js"></script>
<script>
window.DUR = 16; window.MUSICA = 'dj';
const C = [['Guiones de evento', 25], ['Kit de emergencia', 15], ['Checklist', 10], ['Intros, cortes y transiciones', 20], ['Leer la pista', 15], ['Plan de 7 días', 15], ['Mensajes para eventos', 20]];
const eq = document.getElementById('eq'), nm = document.getElementById('nm'), T0 = 1.5, P = 1.3, MAXS = 26; window.SFX = C.map((_, i) => [T0 + i * P, 'pop']).concat([[12.3, 'ding']]);
C.forEach(([n, v]) => { let s = ''; for (let j = 0; j < MAXS; j++) s += `<i class="${j > 21 ? 'r' : (j > 16 ? 'a' : '')}"></i>`; eq.insertAdjacentHTML('beforeend', `<div class="col"><div class="bar">${s}</div><div class="v">$${v}</div></div>`); nm.insertAdjacentHTML('beforeend', `<span>${n}</span>`); });
M.split('.t');
const cols = [...eq.children];
window.onFrame = (t) => { let tot = 0;
  cols.forEach((c, i) => { const v = C[i][1], k = M.out(M.cl((t - T0 - i * P) / .7)), base = v / 25 * 22 * k, lat = k > 0 ? Math.sin(t * 7 + i * 1.7) * 1.2 * k : 0, n = Math.max(0, Math.round(base + lat));
    [...c.firstChild.children].forEach((b, j) => b.style.opacity = j < n ? 1 : .07);
    const vv = c.lastChild; vv.style.opacity = k; vv.style.bottom = (n * 20 + 16) + 'px'; tot += v * (k >= .5 ? 1 : 0); });
  document.getElementById('tt').textContent = '$' + tot; };
</script>
</body></html>
