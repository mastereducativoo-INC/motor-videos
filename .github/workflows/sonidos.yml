name: Biblioteca de sonidos CC0
# Busca efectos reales con licencia CC0 en Openverse, los escucha con earshot y guarda los mejores en vsl/motion/sfx/cc0.
on:
  workflow_dispatch:
    inputs:
      tipos:
        description: 'Tipos separados por coma (vacío = todos)'
        required: false
        default: ''
      que:
        description: 'efectos | musica'
        required: false
        default: 'efectos'
permissions:
  contents: write
jobs:
  biblioteca:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Modelos para escuchar (earshot)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/earshot
          key: earshot-modelos-v1
      - name: Programas
        run: |
          curl -sSfL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/
          pip install -q uv && uv tool install -q "earshot @ git+https://github.com/Leonxlnx/earshot" && earshot doctor --fetch
      - name: Buscar, escuchar y elegir efectos
        if: inputs.que != 'musica'
        env:
          TIPOS: ${{ inputs.tipos }}
        run: python vsl/sonidos/biblioteca.py
      - name: Escuchar la música y calificarla por nicho
        if: inputs.que == 'musica'
        run: python vsl/sonidos/musica.py
      - name: Guardar la biblioteca
        run: |
          git config user.name "Fábrica de sonidos" && git config user.email "noreply@github.com"
          git add vsl/motion/sfx/cc0 vsl/motion/musica/escuchada.json 2>/dev/null; git commit -m "Sonido escuchado con earshot (${{ inputs.que }})" && git push || echo "sin cambios"
