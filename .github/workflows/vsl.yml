# Estudio de VSL: el panel lo llama al presionar "Producir video". Arma la voz y el video y los sube al panel.
name: vsl
run-name: VSL ${{ inputs.id }} · versión ${{ inputs.variante }}
on:
  workflow_dispatch:
    inputs:
      id:
        description: Id del VSL en el panel
        required: true
      variante:
        description: Versión (1 a 5)
        required: false
        default: '1'
      panel:
        description: Dirección del panel
        required: false
        default: https://panel-master-educativo.pages.dev
      modo:
        description: 'Solo estudio nuevo: video (completo) o vista (cuadros de cada escena + revisión de calidad). Vacío = estudio anterior'
        required: false
        default: ''
      partes:
        description: 'Solo estudio nuevo: en cuántas máquinas se reparten los cuadros, como lista JSON (ej. [0,1,2,3]). [0] = una sola'
        required: false
        default: '[0]'
permissions:
  id-token: write
  contents: read
concurrency:
  group: vsl-${{ inputs.id }}-${{ inputs.variante }}
  cancel-in-progress: true
jobs:
  # modo datos: deja la receta y sus imágenes en la rama vsl-datos (para probar el motor de animación fuera del panel)
  datos:
    if: inputs.modo == 'datos'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: vsl
      - run: pip install -q -r vsl/requirements.txt
      - env:
          VSL_ID: ${{ inputs.id }}
          VSL_N: ${{ inputs.variante }}
          VSL_MODO: datos
          PANEL: ${{ inputs.panel }}
        run: python vsl/gh_render.py
      - run: |
          cd /tmp/datos && git init -q -b vsl-datos && git add -A
          git -c user.name=vsl -c user.email=vsl@users.noreply.github.com commit -qm "datos ${{ inputs.id }} ${{ inputs.variante }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" vsl-datos
  video:
    if: inputs.modo != 'datos'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        parte: ${{ fromJSON(inputs.partes || '[0]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: vsl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vsl/requirements.txt
      - name: Modelo de voz (Kokoro)
        id: modelo
        uses: actions/cache@v4
        with:
          path: vsl/modelo
          key: kokoro-v1.0
      - name: Bajar modelo de voz
        if: steps.modelo.outputs.cache-hit != 'true'
        run: |
          mkdir -p vsl/modelo
          curl -sSfL -o vsl/modelo/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -sSfL -o vsl/modelo/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Modelo para recortar fondos
        if: inputs.modo == ''
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-v1
      - name: Programas
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # ffmpeg ya armado desde GitHub (rápido); si falla, el espejo de Ubuntu con tiempo límite
            curl -sSfL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ \
              || (timeout 300 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 400 sudo apt-get install -y -qq ffmpeg > /dev/null)
          fi
          ffmpeg -version | head -1
          if [ -n "${{ inputs.modo }}" ]; then pip install -q -r vsl/requirements-motion.txt; else pip install -q -r vsl/requirements.txt; fi
      - name: Navegador guardado
        if: inputs.modo != ''
        id: navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Navegador para el motor de animación
        if: inputs.modo != ''
        run: python -m playwright install --with-deps chromium > /dev/null
      - name: Voces ya grabadas (se reutilizan si el texto no cambió)
        if: inputs.modo != ''
        uses: actions/cache@v4
        with:
          path: vsl/motion/largo/build/voz
          key: voz-${{ github.run_id }}
          restore-keys: voz-
      - name: Producir
        env:
          VSL_ID: ${{ inputs.id }}
          VSL_N: ${{ inputs.variante }}
          VSL_MODO: ${{ inputs.modo }}
          VSL_PARTE: ${{ matrix.parte }}
          VSL_PARTES: ${{ strategy.job-total }}
          VSL_CARPETA: /tmp/partes
          PANEL: ${{ inputs.panel }}
          KOKORO_DIR: vsl/modelo
        run: python vsl/gh_render.py
      - name: Guardar esta parte
        if: strategy.job-total > 1
        uses: actions/upload-artifact@v4
        with:
          name: parte-${{ matrix.parte }}
          path: /tmp/partes/
          retention-days: 1
  unir:
    needs: video
    if: inputs.partes != '' && inputs.partes != '[0]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: vsl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vsl/requirements-motion.txt
      - name: Programas
        run: |
          if ! command -v ffmpeg >/dev/null; then
            # ffmpeg ya armado desde GitHub (rápido); si falla, el espejo de Ubuntu con tiempo límite
            curl -sSfL --retry 3 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz && tar -xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* /usr/local/bin/ \
              || (timeout 300 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 400 sudo apt-get install -y -qq ffmpeg > /dev/null)
          fi
          ffmpeg -version | head -1
          pip install -q -r vsl/requirements-motion.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: parte-*
          merge-multiple: true
          path: /tmp/partes
      - name: Unir, revisar y subir
        env:
          VSL_ID: ${{ inputs.id }}
          VSL_N: ${{ inputs.variante }}
          VSL_UNIR: '1'
          VSL_CARPETA: /tmp/partes
          PANEL: ${{ inputs.panel }}
        run: python vsl/gh_render.py
