name: traer
# Descarga archivos públicos (logo, video) y los deja como artefacto para usarlos en otro lado.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Direcciones separadas por espacio'
        required: true
permissions:
  contents: write
jobs:
  traer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p traidos
          for u in $URLS; do
            f="traidos/$(basename "${u%%\?*}")"
            curl -fsSL -A "Mozilla/5.0" -o "$f" "$u" && ls -la "$f"
          done
      - name: Guardar en la rama traidos (temporal)
        run: |
          cd traidos
          git init -q -b traidos
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A && git commit -qm "traidos $(date -u +%FT%TZ)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" traidos
